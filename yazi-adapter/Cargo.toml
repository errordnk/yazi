[package]
name                   = "yazi-adapter"
description            = "Yazi image adapter"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
yazi-config   = { path = "../yazi-config", version = "26.8.15" }
yazi-emulator = { path = "../yazi-emulator", version = "26.8.15" }
yazi-fs       = { path = "../yazi-fs", version = "26.8.15" }
yazi-macro    = { path = "../yazi-macro", version = "26.8.15" }
yazi-shared   = { path = "../yazi-shared", version = "26.8.15" }
yazi-shim     = { path = "../yazi-shim", version = "26.8.15" }
yazi-tty      = { path = "../yazi-tty", version = "26.8.15" }
yazi-widgets  = { path = "../yazi-widgets", version = "26.8.15" }

# External dependencies
ansi-to-tui  = { workspace = true }
anyhow       = { workspace = true }
base64       = { workspace = true }
image        = { workspace = true }
inventory    = { workspace = true }
moxcms       = "0.9.0"
palette      = { version = "0.7.7", default-features = false }
quantette    = { version = "0.6.0", default-features = false }
ratatui-core = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
strum        = { workspace = true }
symphonia    = { version = "0.5", features = [ "mp3", "flac" ] }
tokio        = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_System_IO",
	"Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
